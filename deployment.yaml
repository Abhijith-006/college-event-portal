
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-portal
  labels:
    app: college-event-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: college-event-portal
  template:
    metadata:
      labels:
        app: college-event-portal
    spec:
      containers:
        - name: college-event-portal
          image: abhijith006/college-event-portal:1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: college-event-portal-service
spec:
  type: NodePort
  selector:
    app: college-event-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
